<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythical Menagerie</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body {
            font-family: 'Crimson Text', serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f5f0e1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: #333;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: #c9a227;
        }

        nav ul {
            display: flex;
            gap: 1rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .hamburger {
            display: block;
            width: 30px;
            height: 30px;
            background-color: #c9a227;
            border: none;
        }

        @media (min-width: 768px) {
            .hamburger {
                display: none;
            }
        }

        main {
            padding: 2rem 0;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #333;
            color: #f5f0e1;
        }

        /* Home Page */
        #home .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }

        #home .featured-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        #home .profession-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        /* Catalogue Page */
        #catalogue .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        #catalogue .creature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        /* Creature Detail Page */
        #creature-detail .wrapper {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 600px) {
            #creature-detail .wrapper {
                grid-template-columns: 1fr;
            }
        }

        #creature-detail .info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #creature-detail .traits {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        #creature-detail table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Cart Page */
        #cart .wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 680px;
            margin: 0 auto;
        }

        #cart .order-list .row {
            display: flex;
            justify-content: space-between;
        }

        #cart .delivery-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        #cart .delivery-form .full-width {
            grid-column: 1 / -1;
        }

        /* Contact Page */
        #contact .form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 560px;
            margin: 0 auto;
        }

        #contact .form .field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
    </style>
</head>
<body>
    <header class="container">
        <h1>Mythical Menagerie</h1>
        <button class="hamburger" aria-label="Menu"></button>
        <nav>
            <ul>
                <li><a href="#" data-page="home">Home</a></li>
                <li><a href="#" data-page="catalogue">Catalogue</a></li>
                <li><a href="#" data-page="cart">Cart</a></li>
                <li><a href="#" data-page="contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="container active">
            <div class="hero">
                <h2>Welcome to Mythical Menagerie</h2>
                <p>Your one-stop shop for fantastical creatures.</p>
            </div>
            <div class="featured-cards">
                <!-- Featured cards go here -->
            </div>
            <div class="profession-grid">
                <!-- Profession grid goes here -->
            </div>
        </section>

        <section id="catalogue" class="container">
            <div class="filters">
                <!-- Filters go here -->
            </div>
            <div class="creature-grid">
                <!-- Creature cards go here -->
            </div>
        </section>

        <section id="cart" class="container">
            <div class="wrapper">
                <div class="order-list">
                    <!-- Order rows go here -->
                </div>
                <form class="delivery-form">
                    <!-- Delivery form fields go here -->
                </form>
            </div>
        </section>

        <section id="contact" class="container">
            <form class="form">
                <div class="field">
                    <!-- Form fields go here -->
                </div>
            </form>
        </section>
    </main>

    <footer class="container">
        <p>&copy; 2026 Mythical Menagerie. All rights reserved.</p>
    </footer>

    <script>
        const sections = document.querySelectorAll('section');
        const navLinks = document.querySelectorAll('nav a');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.dataset.page;

                sections.forEach(section => {
                    section.classList.remove('active');
                });

                document.getElementById(page).classList.add('active');
            });
        });
    </script>
</body>
</html>
